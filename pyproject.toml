[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "columbia-estuary-intelligence"
version = "0.1.0"
description = "Noncommercial ASU PlanetScope estuary research prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "rasterio>=1.3,<2", "matplotlib>=3.7,<4", "requests>=2.31,<3"]

[tool.setuptools.packages.find]
where = ["src"]
